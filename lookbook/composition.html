<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamwear Lookbook</title>

    <!-- Three.js from CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
        }

        /* Controls overlay */
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 100;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        #controls:hover {
            opacity: 1;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: white;
            border-color: white;
            color: black;
        }

        .btn.primary,
        .btn.selected {
            background: white;
            border-color: white;
            color: black;
        }

        /* Info panel */
        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 12px;
            max-width: 300px;
            z-index: 100;
            opacity: 0.7;
            pointer-events: none;
        }

        #info h2 {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #info .transcription {
            font-style: italic;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 8px;
            line-height: 1.4;
        }

        #info .keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .keyword {
            background: rgba(236, 72, 153, 0.3);
            padding: 4px 8px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* LARGE SEMI-TRANSPARENT NAVIGATION ARROWS */
        .nav-arrow {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 90;
            transition: all 0.3s ease;
            background: linear-gradient(
                to right,
                rgba(0, 0, 0, 0.4) 0%,
                rgba(0, 0, 0, 0) 100%
            );
            opacity: 0.3;
        }

        .nav-arrow:hover {
            opacity: 0.8;
            width: 140px;
        }

        .nav-arrow.prev {
            left: 0;
            background: linear-gradient(
                to right,
                rgba(0, 0, 0, 0.5) 0%,
                rgba(0, 0, 0, 0) 100%
            );
        }

        .nav-arrow.next {
            right: 0;
            background: linear-gradient(
                to left,
                rgba(0, 0, 0, 0.5) 0%,
                rgba(0, 0, 0, 0) 100%
            );
        }

        .nav-arrow svg {
            width: 60px;
            height: 60px;
            fill: white;
            filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
            transition: transform 0.2s ease;
        }

        .nav-arrow:hover svg {
            transform: scale(1.1);
        }

        .nav-arrow.prev svg {
            margin-left: -20px;
        }

        .nav-arrow.next svg {
            margin-right: -20px;
        }

        /* Loading state */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 200;
        }

        .hidden {
            display: none !important;
        }

        /* Composition counter */
        #counter {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            z-index: 100;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="loading">Loading composition...</div>

    <div id="info" class="hidden">
        <h2 id="composition-title">DREAMWEAR</h2>
        <div class="transcription" id="transcription"></div>
        <div class="keywords" id="keywords"></div>
    </div>

    <div id="controls" class="hidden">
        <button class="btn" id="btn-orbit">Free Orbit</button>
        <button class="btn primary" id="btn-snap">Snap to View</button>
        <button class="btn" id="btn-screenshot">Export Print</button>
    </div>

    <!-- LARGE SEMI-TRANSPARENT NAVIGATION ARROWS -->
    <div class="nav-arrow prev" id="arrow-prev" title="Previous composition">
        <svg viewBox="0 0 24 24">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
    </div>
    <div class="nav-arrow next" id="arrow-next" title="Next composition">
        <svg viewBox="0 0 24 24">
            <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
        </svg>
    </div>

    <div id="counter" class="hidden"></div>

    <script type="module">
        import { AnamorphicScene } from './static/js/AnamorphicScene.js';
        import { CompositionLoader } from './static/js/CompositionLoader.js';
        import { ScreenshotCapture } from './static/js/ScreenshotCapture.js';

        // Get composition ID from URL params
        const params = new URLSearchParams(window.location.search);
        let compositionId = params.get('id') || 'test';

        // Store all composition IDs for navigation
        let allCompositionIds = [];
        let currentIndex = -1;

        // Initialize
        const container = document.getElementById('canvas-container');
        const scene = new AnamorphicScene(container);
        const loader = new CompositionLoader();
        const screenshot = new ScreenshotCapture(scene.renderer, scene.scene, scene.camera);

        // Load composition index
        async function loadCompositionIndex() {
            try {
                const response = await fetch('/compositions/index.json');
                if (response.ok) {
                    allCompositionIds = await response.json();
                    currentIndex = allCompositionIds.indexOf(compositionId);
                }
            } catch (e) {
                console.log('No composition index found');
            }
        }

        // Update counter display
        function updateCounter() {
            const counter = document.getElementById('counter');
            if (allCompositionIds.length > 0 && currentIndex >= 0) {
                counter.textContent = `${currentIndex + 1} / ${allCompositionIds.length}`;
                counter.classList.remove('hidden');
            }
        }

        // Navigate to composition
        // NOTE: Dissolution transitions disabled - see plan Part 12 for fix
        let isNavigating = false;
        async function navigateTo(index) {
            if (allCompositionIds.length === 0) return;
            if (isNavigating) return; // Prevent rapid navigation during transition

            isNavigating = true;

            // Wrap around
            if (index < 0) index = allCompositionIds.length - 1;
            if (index >= allCompositionIds.length) index = 0;

            // DISSOLUTION DISABLED - uncomment when fixed:
            // await scene.transitionOut();

            currentIndex = index;
            compositionId = allCompositionIds[index];

            // Update URL without reloading
            const newUrl = `${window.location.pathname}?id=${compositionId}`;
            window.history.pushState({ id: compositionId }, '', newUrl);

            // Load new composition
            await loadComposition(compositionId);

            // DISSOLUTION DISABLED - uncomment when fixed:
            // scene.transitionIn();

            isNavigating = false;
        }

        // Previous composition
        function goToPrev() {
            navigateTo(currentIndex - 1);
        }

        // Next composition
        function goToNext() {
            navigateTo(currentIndex + 1);
        }

        // Load composition
        async function loadComposition(id) {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('info').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');

            try {
                const config = await loader.loadConfig(id);
                await scene.loadComposition(config);

                // Update info panel - always use title field
                document.getElementById('composition-title').textContent =
                    (config.title || 'Untitled').toUpperCase();
                document.getElementById('transcription').textContent =
                    `"${config.transcription}"`;

                const keywordsEl = document.getElementById('keywords');
                keywordsEl.innerHTML = '';
                (config.keywords || []).forEach(kw => {
                    const span = document.createElement('span');
                    span.className = 'keyword';
                    span.textContent = kw;
                    keywordsEl.appendChild(span);
                });

                // Show UI
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('info').classList.remove('hidden');
                document.getElementById('controls').classList.remove('hidden');
                
                // Update counter
                updateCounter();

            } catch (error) {
                console.error('Failed to load composition:', error);
                document.getElementById('loading').textContent = 'Failed to load composition';
            }
        }

        // Navigation event listeners
        document.getElementById('arrow-prev').addEventListener('click', goToPrev);
        document.getElementById('arrow-next').addEventListener('click', goToNext);

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                goToPrev();
            } else if (e.key === 'ArrowRight') {
                goToNext();
            } else if (e.key === ' ') {
                scene.snapToAnamorphicView();
            } else if (e.key === 'p' || e.key === 'P') {
                screenshot.captureHighRes(4096, 4096);
            }
        });

        // Control handlers
        document.getElementById('btn-orbit').addEventListener('click', () => {
            scene.enableOrbit(true);
        });

        document.getElementById('btn-snap').addEventListener('click', () => {
            scene.snapToAnamorphicView();
        });

        document.getElementById('btn-screenshot').addEventListener('click', () => {
            screenshot.captureHighRes(4096, 4096);
        });

        // Browser back/forward handling
        window.addEventListener('popstate', (e) => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (id && id !== compositionId) {
                compositionId = id;
                currentIndex = allCompositionIds.indexOf(id);
                loadComposition(id);
            }
        });

        // Start
        await loadCompositionIndex();
        await loadComposition(compositionId);
    </script>
</body>
</html>
