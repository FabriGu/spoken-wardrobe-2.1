<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamwear Lookbook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        #gallery-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .gallery-title {
            position: absolute;
            font-size: 14px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
        }

        .gallery-title:hover {
            color: rgba(255, 255, 255, 1);
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.6),
                         0 0 80px rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%) scale(1.15);
        }

        /* Header - minimal */
        #header {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            opacity: 0.4;
        }

        #header h1 {
            font-size: 12px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        /* Create button */
        #create-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        #create-btn:hover {
            background: white;
            color: black;
            border-color: white;
        }

        /* Counter */
        #counter {
            position: fixed;
            bottom: 30px;
            right: 30px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            font-family: monospace;
            z-index: 100;
        }

        /* Loading state */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>Dreamwear</h1>
    </div>

    <div id="gallery-container">
        <div id="loading">Loading dreams...</div>
    </div>

    <button id="create-btn">Create Your Own</button>
    <div id="counter"></div>

    <script>
        let compositions = [];
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let targetMouseX = mouseX;
        let targetMouseY = mouseY;

        // Smooth mouse tracking
        document.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX;
            targetMouseY = e.clientY;
        });

        // Animation loop for smooth parallax
        function animate() {
            // Smooth interpolation
            mouseX += (targetMouseX - mouseX) * 0.08;
            mouseY += (targetMouseY - mouseY) * 0.08;

            updateTitlePositions();
            requestAnimationFrame(animate);
        }

        async function loadGallery() {
            const container = document.getElementById('gallery-container');

            try {
                // Load index
                const indexRes = await fetch('/compositions/index.json');
                const ids = await indexRes.json();

                // Load all compositions
                for (const id of ids) {
                    try {
                        const res = await fetch(`/compositions/${id}.json`);
                        const config = await res.json();
                        compositions.push(config);
                    } catch (e) {
                        console.warn(`Failed to load ${id}`);
                    }
                }

                // Remove loading text
                document.getElementById('loading').remove();

                // Update counter
                document.getElementById('counter').textContent = `${compositions.length} dreams`;

                // Distribute titles across screen
                compositions.forEach((comp, i) => {
                    createTitle(comp, i, container);
                });

                // Start animation loop
                animate();

            } catch (e) {
                console.error('Failed to load gallery:', e);
                document.getElementById('loading').textContent = 'Failed to load';
            }
        }

        function createTitle(config, index, container) {
            const title = document.createElement('div');
            title.className = 'gallery-title';

            // Always use title field
            const displayTitle = config.title || 'Untitled';
            title.textContent = displayTitle;
            title.dataset.index = index;

            // Distribute in grid pattern with randomness
            const cols = Math.ceil(Math.sqrt(compositions.length * 1.5));
            const rows = Math.ceil(compositions.length / cols);

            const col = index % cols;
            const row = Math.floor(index / cols);

            // Add padding from edges
            const padding = 100;
            const usableWidth = window.innerWidth - padding * 2;
            const usableHeight = window.innerHeight - padding * 2;

            const cellWidth = usableWidth / cols;
            const cellHeight = usableHeight / rows;

            // Base position (center of cell) with randomness
            const baseX = padding + cellWidth * col + cellWidth / 2 + (Math.random() - 0.5) * cellWidth * 0.4;
            const baseY = padding + cellHeight * row + cellHeight / 2 + (Math.random() - 0.5) * cellHeight * 0.4;

            title.style.left = `${baseX}px`;
            title.style.top = `${baseY}px`;

            // Store base position for parallax
            title.dataset.baseX = baseX;
            title.dataset.baseY = baseY;
            title.dataset.depth = (0.3 + Math.random() * 1.2).toFixed(2); // Parallax depth

            title.addEventListener('click', () => {
                window.location.href = `/composition.html?id=${config.id}`;
            });

            container.appendChild(title);
        }

        function updateTitlePositions() {
            const titles = document.querySelectorAll('.gallery-title');
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            // Mouse offset from center (normalized -1 to 1)
            const offsetX = (mouseX - centerX) / centerX;
            const offsetY = (mouseY - centerY) / centerY;

            titles.forEach(title => {
                const baseX = parseFloat(title.dataset.baseX);
                const baseY = parseFloat(title.dataset.baseY);
                const depth = parseFloat(title.dataset.depth);

                // Parallax effect - deeper items move more
                const parallaxX = offsetX * 25 * depth;
                const parallaxY = offsetY * 18 * depth;

                title.style.left = `${baseX + parallaxX}px`;
                title.style.top = `${baseY + parallaxY}px`;
            });
        }

        // Create button handler
        document.getElementById('create-btn').addEventListener('click', () => {
            window.location.href = '/create.html';
        });

        // Handle resize - redistribute titles
        window.addEventListener('resize', () => {
            const container = document.getElementById('gallery-container');
            // Remove existing titles
            container.querySelectorAll('.gallery-title').forEach(t => t.remove());
            // Recreate
            compositions.forEach((comp, i) => createTitle(comp, i, container));
        });

        // Start loading
        loadGallery();
    </script>
</body>
</html>
