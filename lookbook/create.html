<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamwear - Create</title>

    <!-- Three.js from CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <!-- QR Code library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

    <!-- MediaPipe for segmentation -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Info panel - matches composition.html style */
        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            max-width: 400px;
            z-index: 100;
            opacity: 0.7;
        }

        #title {
            font-size: 24px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            min-height: 30px;
        }

        /* Prompt input - styled like transcription quote */
        #prompt-container {
            position: relative;
            display: flex;
            align-items: flex-start;
        }

        #prompt-container::before {
            content: '"';
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-style: italic;
            margin-right: 2px;
        }

        #prompt-container::after {
            content: '"';
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-style: italic;
            margin-left: 2px;
        }

        #prompt-input {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-family: inherit;
            font-size: 14px;
            font-style: italic;
            line-height: 1.4;
            width: 100%;
            outline: none;
            resize: none;
            padding: 0;
        }

        #prompt-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        #prompt-input:focus {
            caret-color: white;
        }

        /* Mic button */
        #mic-btn {
            position: fixed;
            top: 100px;
            left: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 100;
        }

        #mic-btn:hover {
            background: white;
            color: black;
        }

        #mic-btn.recording {
            background: rgba(255, 80, 80, 0.3);
            border-color: rgba(255, 80, 80, 0.8);
            animation: pulse 1s infinite;
        }

        #mic-btn.recording:hover {
            background: rgba(255, 80, 80, 0.5);
            color: white;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 80, 80, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255, 80, 80, 0); }
        }

        /* Instructions - white text on slight opacity bg */
        .instruction {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 16px 32px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            z-index: 100;
            backdrop-filter: blur(10px);
            max-width: 400px;
        }

        .instruction small {
            display: block;
            margin-top: 8px;
            font-size: 11px;
            opacity: 0.6;
            text-transform: none;
            letter-spacing: 0;
        }

        .instruction.hidden { display: none; }

        /* Standard buttons */
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .btn:hover,
        .btn.selected {
            background: white;
            color: black;
            border-color: white;
        }

        /* Controls */
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 100;
            opacity: 0.8;
        }

        #controls.hidden { display: none; }

        /* Navigation arrows - hidden until complete */
        .nav-arrow {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease;
            background: linear-gradient(
                to right,
                rgba(0, 0, 0, 0.4) 0%,
                rgba(0, 0, 0, 0) 100%
            );
        }

        .nav-arrow.visible {
            opacity: 0.3;
            pointer-events: auto;
        }

        .nav-arrow.visible:hover {
            opacity: 0.8;
            width: 140px;
        }

        .nav-arrow.prev {
            left: 0;
            background: linear-gradient(
                to right,
                rgba(0, 0, 0, 0.5) 0%,
                rgba(0, 0, 0, 0) 100%
            );
        }

        .nav-arrow.next {
            right: 0;
            background: linear-gradient(
                to left,
                rgba(0, 0, 0, 0.5) 0%,
                rgba(0, 0, 0, 0) 100%
            );
        }

        .nav-arrow svg {
            width: 60px;
            height: 60px;
            fill: white;
            filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
            transition: transform 0.2s ease;
        }

        .nav-arrow:hover svg {
            transform: scale(1.1);
        }

        /* Generated image preview */
        #preview-image {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            max-width: 400px;
            max-height: 400px;
            opacity: 0;
            transition: all 1s ease;
            z-index: 50;
        }

        #preview-image.visible {
            opacity: 1;
        }

        #preview-image.aside {
            left: 15%;
            top: 40%;
            max-width: 150px;
            max-height: 150px;
            opacity: 0.4;
        }

        /* Progress indicator */
        #progress {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 100;
        }

        #progress.hidden { display: none; }

        /* Back button */
        #back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        /* QR Code Overlay */
        #qr-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #qr-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .qr-content {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .qr-content h3 {
            font-size: 18px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 24px;
            color: rgba(255, 255, 255, 0.8);
        }

        .qr-content canvas {
            margin-bottom: 16px;
            background: black;
        }

        .qr-content .share-url {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 20px;
            word-break: break-all;
            max-width: 250px;
        }

        /* Webcam Preview */
        #webcam-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            display: none;
        }

        #webcam-container.visible {
            display: block;
        }

        #webcam-video {
            width: 640px;
            max-width: 90vw;
            height: auto;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            transform: scaleX(-1); /* Mirror for selfie view */
        }

        #webcam-canvas {
            display: none; /* Hidden canvas for capture */
        }

        #mask-canvas {
            display: none; /* Hidden canvas for segmentation mask */
        }

        /* A-pose guide overlay */
        #pose-guide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #pose-guide svg {
            width: 300px;
            height: 400px;
            opacity: 0.3;
        }

        /* Countdown overlay */
        #capture-countdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: 300;
            color: white;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
            z-index: 60;
            display: none;
        }

        #capture-countdown.visible {
            display: block;
            animation: countdownPulse 1s ease-out;
        }

        @keyframes countdownPulse {
            0% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* Camera status */
        #camera-status {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            z-index: 100;
        }

        #camera-status.hidden { display: none; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="info">
        <div id="title"></div>
        <div id="prompt-container">
            <textarea id="prompt-input"
                      rows="3"
                      placeholder="Describe your dream clothing..."
                      maxlength="200"></textarea>
        </div>
    </div>

    <button id="mic-btn" title="Click to speak">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
    </button>

    <button id="back-btn" class="btn" onclick="window.location.href='/'">Back</button>

    <!-- Webcam Container -->
    <div id="webcam-container">
        <video id="webcam-video" autoplay playsinline></video>
        <canvas id="webcam-canvas" width="640" height="480"></canvas>
        <canvas id="mask-canvas" width="640" height="480"></canvas>
        <div id="pose-guide">
            <!-- Simple A-pose silhouette guide -->
            <svg viewBox="0 0 100 140" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2">
                <!-- Head -->
                <circle cx="50" cy="15" r="10" />
                <!-- Body -->
                <line x1="50" y1="25" x2="50" y2="70" />
                <!-- Arms extended -->
                <line x1="50" y1="35" x2="15" y2="55" />
                <line x1="50" y1="35" x2="85" y2="55" />
                <!-- Legs -->
                <line x1="50" y1="70" x2="35" y2="120" />
                <line x1="50" y1="70" x2="65" y2="120" />
            </svg>
        </div>
    </div>

    <!-- Capture Countdown -->
    <div id="capture-countdown"></div>

    <!-- Camera Status -->
    <div id="camera-status" class="hidden"></div>

    <!-- Instructions -->
    <div id="instruction-pose" class="instruction hidden">
        Stand in A-pose<br>
        Arms extended to the sides
        <small>Press SPACE when ready</small>
    </div>

    <div id="instruction-generating" class="instruction hidden">
        Generating your dream...
        <small>This may take a moment</small>
    </div>

    <div id="instruction-mesh" class="instruction hidden">
        Creating 3D form...
        <small>Transforming 2D to 3D</small>
    </div>

    <!-- Preview image (shown during generation) -->
    <img id="preview-image" src="" alt="Generated clothing" />

    <!-- Progress text -->
    <div id="progress" class="hidden"></div>

    <!-- Navigation arrows (hidden until complete) -->
    <div class="nav-arrow prev" id="arrow-prev">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </div>
    <div class="nav-arrow next" id="arrow-next">
        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </div>

    <!-- Controls (hidden until complete) -->
    <div id="controls" class="hidden">
        <button class="btn" id="btn-orbit">Free Orbit</button>
        <button class="btn selected" id="btn-snap">Snap to View</button>
        <button class="btn" id="btn-share">Share</button>
    </div>

    <!-- QR Code Overlay -->
    <div id="qr-overlay">
        <div class="qr-content">
            <h3>Take Your Dream</h3>
            <canvas id="qr-canvas"></canvas>
            <p class="share-url" id="share-url"></p>
            <button class="btn" id="btn-close-qr">Close</button>
        </div>
    </div>

    <script type="module">
        import { AnamorphicScene } from './static/js/AnamorphicScene.js';

        // ==========================================
        // STATE MACHINE
        // ==========================================
        const STATES = {
            INPUT: 'input',           // User typing/speaking prompt
            POSE: 'pose',             // Waiting for A-pose
            CAPTURE: 'capture',       // Capturing frame
            GENERATE_2D: 'generate_2d',  // ComfyUI generating
            GENERATE_3D: 'generate_3d',  // Rodin generating mesh
            COMPLETE: 'complete'      // Done, can browse
        };

        let currentState = STATES.INPUT;
        let scene = null;
        let recognition = null;
        let isRecording = false;
        let prompt = '';
        let generatedTitle = '';

        // Webcam & Segmentation
        let webcamStream = null;
        let selfieSegmentation = null;
        let latestSegmentationMask = null;
        let capturedFrameBase64 = null;
        let segmentationMaskBase64 = null;

        // ==========================================
        // WEBCAM & SEGMENTATION
        // ==========================================
        async function initWebcam() {
            const video = document.getElementById('webcam-video');
            const statusEl = document.getElementById('camera-status');

            statusEl.textContent = 'Initializing camera...';
            statusEl.classList.remove('hidden');

            try {
                // Request camera - prefer built-in camera over Continuity Camera
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');

                console.log('Available cameras:', videoDevices.map(d => d.label));

                // Find built-in camera (usually contains "FaceTime" or "Built-in" on Mac)
                let preferredDevice = videoDevices.find(d =>
                    d.label.toLowerCase().includes('facetime') ||
                    d.label.toLowerCase().includes('built-in') ||
                    d.label.toLowerCase().includes('isight')
                );

                // If not found, use the first camera that's NOT iPhone/Continuity
                if (!preferredDevice) {
                    preferredDevice = videoDevices.find(d =>
                        !d.label.toLowerCase().includes('iphone') &&
                        !d.label.toLowerCase().includes('continuity')
                    ) || videoDevices[0];
                }

                const constraints = {
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    }
                };

                if (preferredDevice) {
                    constraints.video.deviceId = { exact: preferredDevice.deviceId };
                    console.log('Using camera:', preferredDevice.label);
                }

                webcamStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = webcamStream;
                await video.play();

                statusEl.textContent = 'Camera ready';

                // Initialize segmentation
                await initSegmentation();

                return true;
            } catch (error) {
                console.error('Camera error:', error);
                statusEl.textContent = `Camera error: ${error.message}`;
                return false;
            }
        }

        async function initSegmentation() {
            const statusEl = document.getElementById('camera-status');
            statusEl.textContent = 'Loading segmentation model...';

            try {
                selfieSegmentation = new SelfieSegmentation({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`;
                    }
                });

                selfieSegmentation.setOptions({
                    modelSelection: 1,  // 1 = landscape model (better for full body)
                    selfieMode: true
                });

                selfieSegmentation.onResults(onSegmentationResults);

                // Start processing frames
                processWebcamFrame();

                statusEl.textContent = 'Ready - Press SPACE to capture';
                console.log('Segmentation initialized');
            } catch (error) {
                console.error('Segmentation error:', error);
                statusEl.textContent = 'Segmentation unavailable';
            }
        }

        function onSegmentationResults(results) {
            // Store the latest segmentation mask
            if (results.segmentationMask) {
                const maskCanvas = document.getElementById('mask-canvas');
                const ctx = maskCanvas.getContext('2d');

                // Draw the segmentation mask (white = person, black = background)
                ctx.drawImage(results.segmentationMask, 0, 0, maskCanvas.width, maskCanvas.height);

                // Store reference
                latestSegmentationMask = results.segmentationMask;
            }
        }

        async function processWebcamFrame() {
            if (!selfieSegmentation || !webcamStream) return;

            const video = document.getElementById('webcam-video');

            if (video.readyState >= 2) {
                try {
                    await selfieSegmentation.send({ image: video });
                } catch (e) {
                    // Ignore errors during frame processing
                }
            }

            // Continue processing if webcam is active
            if (webcamStream) {
                requestAnimationFrame(processWebcamFrame);
            }
        }

        function stopWebcam() {
            if (webcamStream) {
                webcamStream.getTracks().forEach(track => track.stop());
                webcamStream = null;
            }

            document.getElementById('webcam-container').classList.remove('visible');
            document.getElementById('camera-status').classList.add('hidden');
        }

        async function captureFrameAndMask() {
            const video = document.getElementById('webcam-video');
            const frameCanvas = document.getElementById('webcam-canvas');
            const maskCanvas = document.getElementById('mask-canvas');

            // Capture frame (flip horizontally to match mirrored preview)
            const frameCtx = frameCanvas.getContext('2d');
            frameCtx.save();
            frameCtx.scale(-1, 1);
            frameCtx.drawImage(video, -frameCanvas.width, 0, frameCanvas.width, frameCanvas.height);
            frameCtx.restore();

            // Get frame as base64 (remove data URL prefix)
            capturedFrameBase64 = frameCanvas.toDataURL('image/png').split(',')[1];

            // Get mask as base64
            // The mask from selfie segmentation has person in white
            // But we need to convert it to grayscale where body = 255
            const maskCtx = maskCanvas.getContext('2d');

            // If we have a segmentation mask, use it
            if (latestSegmentationMask) {
                // Flip mask horizontally to match
                maskCtx.save();
                maskCtx.scale(-1, 1);
                maskCtx.drawImage(latestSegmentationMask, -maskCanvas.width, 0, maskCanvas.width, maskCanvas.height);
                maskCtx.restore();

                // Convert to proper grayscale mask
                const imageData = maskCtx.getImageData(0, 0, maskCanvas.width, maskCanvas.height);
                const data = imageData.data;

                for (let i = 0; i < data.length; i += 4) {
                    // Alpha channel contains the segmentation
                    // We want white (255) where person is
                    const alpha = data[i + 3];
                    const value = alpha > 128 ? 255 : 0;
                    data[i] = value;     // R
                    data[i + 1] = value; // G
                    data[i + 2] = value; // B
                    data[i + 3] = 255;   // A
                }

                maskCtx.putImageData(imageData, 0, 0);
            } else {
                // Fallback: create a simple center mask
                maskCtx.fillStyle = 'black';
                maskCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);
                maskCtx.fillStyle = 'white';
                maskCtx.fillRect(
                    maskCanvas.width * 0.2,
                    maskCanvas.height * 0.1,
                    maskCanvas.width * 0.6,
                    maskCanvas.height * 0.8
                );
            }

            segmentationMaskBase64 = maskCanvas.toDataURL('image/png').split(',')[1];

            console.log('Frame captured:', capturedFrameBase64.length, 'bytes');
            console.log('Mask captured:', segmentationMaskBase64.length, 'bytes');

            return { frame: capturedFrameBase64, mask: segmentationMaskBase64 };
        }

        // ==========================================
        // INITIALIZATION
        // ==========================================
        function initScene() {
            const container = document.getElementById('canvas-container');
            scene = new AnamorphicScene(container);
            scene.setBackgroundColor(0x000000);
            scene.setPostProcessingPreset('dreamy');
            scene.setFilmEffect({ scanlineIntensity: 0 }); // No TV lines
        }

        function initSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                console.warn('Speech recognition not supported');
                document.getElementById('mic-btn').style.display = 'none';
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = 0; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                document.getElementById('prompt-input').value = transcript;
            };

            recognition.onerror = (event) => {
                console.error('Speech error:', event.error);
                stopRecording();
            };

            recognition.onend = () => {
                if (isRecording) {
                    // Restart if still recording
                    recognition.start();
                }
            };
        }

        // ==========================================
        // RECORDING CONTROLS
        // ==========================================
        function startRecording() {
            if (!recognition) return;
            isRecording = true;
            document.getElementById('mic-btn').classList.add('recording');
            document.getElementById('mic-btn').title = 'Click to stop';
            try {
                recognition.start();
            } catch (e) {
                console.warn('Recognition already started');
            }
        }

        function stopRecording() {
            if (!recognition) return;
            isRecording = false;
            document.getElementById('mic-btn').classList.remove('recording');
            document.getElementById('mic-btn').title = 'Click to speak';
            recognition.stop();
        }

        function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        // ==========================================
        // TITLE GENERATION
        // ==========================================
        function generateTitle(promptText) {
            const stopwords = ['a', 'an', 'the', 'is', 'it', 'to', 'of', 'and', 'or', 'in', 'on', 'for', 'with', 'me', 'my', 'i', 'make', 'want', 'like', 'would', 'please', 'can', 'get', 'some'];
            const words = promptText.toLowerCase()
                .replace(/[^\w\s]/g, '')
                .split(/\s+/)
                .filter(w => w.length > 2 && !stopwords.includes(w));

            if (words.length === 0) return 'Untitled Dream';

            const titleWords = words.slice(0, 3);
            return titleWords.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        }

        // ==========================================
        // STATE MANAGEMENT
        // ==========================================
        function setState(newState) {
            console.log(`[Create] State: ${currentState} → ${newState}`);
            currentState = newState;

            // Hide all instructions
            document.querySelectorAll('.instruction').forEach(el => el.classList.add('hidden'));
            document.getElementById('progress').classList.add('hidden');

            switch (newState) {
                case STATES.INPUT:
                    document.getElementById('prompt-input').disabled = false;
                    document.getElementById('prompt-input').focus();
                    break;

                case STATES.POSE:
                    document.getElementById('prompt-input').disabled = true;
                    document.getElementById('mic-btn').style.display = 'none';
                    document.getElementById('instruction-pose').classList.remove('hidden');
                    // Show webcam and initialize camera
                    document.getElementById('webcam-container').classList.add('visible');
                    initWebcam().then(success => {
                        if (!success) {
                            // Camera failed, show instruction to proceed without camera
                            document.getElementById('camera-status').textContent =
                                'Camera unavailable - will use default image';
                        }
                    });
                    break;

                case STATES.CAPTURE:
                    document.getElementById('instruction-pose').classList.add('hidden');
                    // Start capture countdown
                    startCaptureCountdown();
                    break;

                case STATES.GENERATE_2D:
                    document.getElementById('instruction-generating').classList.remove('hidden');
                    setProgress('Generating 2D clothing...');
                    // Call ComfyUI API (falls back to simulation if unavailable)
                    generate2D().catch(e => {
                        console.error('2D generation failed:', e);
                        simulateGeneration2D();
                    });
                    break;

                case STATES.GENERATE_3D:
                    document.getElementById('instruction-generating').classList.add('hidden');
                    document.getElementById('instruction-mesh').classList.remove('hidden');
                    setProgress('Creating 3D mesh...');
                    // Call Rodin API (falls back to simulation if unavailable)
                    generate3D().catch(e => {
                        console.error('3D generation failed:', e);
                        simulateGeneration3D();
                    });
                    break;

                case STATES.COMPLETE:
                    document.getElementById('instruction-mesh').classList.add('hidden');
                    document.getElementById('progress').classList.add('hidden');
                    // Show navigation arrows
                    document.getElementById('arrow-prev').classList.add('visible');
                    document.getElementById('arrow-next').classList.add('visible');
                    // Show controls
                    document.getElementById('controls').classList.remove('hidden');
                    break;
            }
        }

        function setProgress(text) {
            document.getElementById('progress').textContent = text;
            document.getElementById('progress').classList.remove('hidden');
        }

        async function startCaptureCountdown() {
            const countdownEl = document.getElementById('capture-countdown');

            // 3-2-1 countdown
            for (let i = 3; i > 0; i--) {
                countdownEl.textContent = i;
                countdownEl.classList.add('visible');
                await new Promise(r => setTimeout(r, 1000));
            }

            // Hide countdown
            countdownEl.classList.remove('visible');

            // Capture!
            setProgress('Capturing...');
            await captureFrameAndMask();

            // Hide webcam
            stopWebcam();

            // Move to generation
            setState(STATES.GENERATE_2D);
        }

        // ==========================================
        // SUBMIT PROMPT
        // ==========================================
        function submitPrompt() {
            prompt = document.getElementById('prompt-input').value.trim();
            if (!prompt) {
                document.getElementById('prompt-input').focus();
                return;
            }

            // Stop recording if active
            if (isRecording) stopRecording();

            // Generate and display title
            generatedTitle = generateTitle(prompt);
            document.getElementById('title').textContent = generatedTitle;

            // Move to pose state
            setState(STATES.POSE);
        }

        // ==========================================
        // GENERATED DATA STORAGE
        // ==========================================
        let generatedImage = null;  // Base64 encoded PNG
        let generatedMesh = null;   // Base64 encoded GLB
        let currentCompositionId = null;

        // ==========================================
        // API CALLS
        // ==========================================
        async function generate2D() {
            setProgress('Generating 2D clothing...');

            try {
                // Build request body with captured frame and mask if available
                const requestBody = {
                    prompt: prompt
                };

                if (capturedFrameBase64) {
                    requestBody.image = capturedFrameBase64;
                    console.log('Using captured frame');
                }

                if (segmentationMaskBase64) {
                    requestBody.mask = segmentationMaskBase64;
                    console.log('Using segmentation mask');
                }

                const response = await fetch('/api/generate-2d', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const result = await response.json();

                if (result.success) {
                    generatedImage = result.image;

                    // Show preview image in center
                    const previewImg = document.getElementById('preview-image');
                    previewImg.src = `data:image/png;base64,${result.image}`;
                    previewImg.classList.add('visible');

                    // Wait a moment, then move to side
                    await new Promise(r => setTimeout(r, 2000));
                    previewImg.classList.add('aside');

                    // Move to 3D generation
                    setState(STATES.GENERATE_3D);
                } else {
                    throw new Error(result.error || '2D generation failed');
                }
            } catch (error) {
                console.error('2D generation error:', error);
                setProgress(`Error: ${error.message}`);
                // Allow retry by going back to pose state after delay
                await new Promise(r => setTimeout(r, 3000));
                setState(STATES.POSE);
            }
        }

        async function generate3D() {
            setProgress('Creating 3D mesh...');

            if (!generatedImage) {
                console.error('No generated image available');
                return;
            }

            try {
                const response = await fetch('/api/generate-3d', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image: generatedImage
                    })
                });

                const result = await response.json();

                if (result.success) {
                    generatedMesh = result.mesh;

                    // Load mesh into scene
                    setProgress('Loading 3D mesh...');

                    // Convert base64 to blob URL for loading
                    const meshBlob = base64ToBlob(result.mesh, 'model/gltf-binary');
                    const meshUrl = URL.createObjectURL(meshBlob);

                    // Load composition with mesh
                    const config = {
                        id: 'preview',
                        title: generatedTitle,
                        transcription: prompt,
                        background: { color: '#0a0a1a' },
                        camera: { position: [0, 0, 8], fov: 50, target: [0, 0, 0] },
                        effects: {
                            postProcessing: 'dreamy',
                            bloom: { enabled: true, strength: 0.8, radius: 0.4 },
                            film: { enabled: true, grainIntensity: 0.05, scanlineIntensity: 0 }
                        },
                        elements: [
                            {
                                type: 'glb_mesh',
                                path: meshUrl,
                                target_2d: { x: 0.5, y: 0.5 },
                                depth_range: { min: 2.5, max: 3.5 },
                                scale: 0.4,
                                animation: true,
                                animationPreset: 'dreamy'
                            }
                        ]
                    };

                    await scene.loadComposition(config);

                    // Save the composition
                    await saveComposition();

                    // Complete
                    setState(STATES.COMPLETE);
                } else {
                    throw new Error(result.error || '3D generation failed');
                }
            } catch (error) {
                console.error('3D generation error:', error);
                setProgress(`Error: ${error.message}`);
                // Still allow completion to see 2D result
                await new Promise(r => setTimeout(r, 3000));
                await saveComposition(); // Save even without 3D
                setState(STATES.COMPLETE);
            }
        }

        async function saveComposition() {
            setProgress('Saving composition...');

            try {
                const response = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        title: generatedTitle,
                        generated_clothing: generatedImage,
                        mesh: generatedMesh,
                        original_frame: capturedFrameBase64,
                        mask: segmentationMaskBase64
                    })
                });

                const result = await response.json();

                if (result.success) {
                    currentCompositionId = result.id;
                    console.log(`Composition saved: ${result.id}`);
                    console.log(`URL: ${result.url}`);
                } else {
                    console.error('Save failed:', result.error);
                }
            } catch (error) {
                console.error('Save error:', error);
            }
        }

        // Helper function to convert base64 to Blob
        function base64ToBlob(base64, mimeType) {
            const byteCharacters = atob(base64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            return new Blob([byteArray], { type: mimeType });
        }

        // ==========================================
        // FALLBACK SIMULATION (for testing without APIs)
        // ==========================================
        async function simulateGeneration2D() {
            console.warn('Using 2D simulation mode');
            setProgress('Simulating 2D generation...');
            await new Promise(r => setTimeout(r, 3000));
            setState(STATES.GENERATE_3D);
        }

        async function simulateGeneration3D() {
            console.warn('Using 3D simulation mode');
            setProgress('Simulating 3D generation...');
            await new Promise(r => setTimeout(r, 3000));
            setState(STATES.COMPLETE);
        }

        // ==========================================
        // EVENT LISTENERS
        // ==========================================
        document.getElementById('mic-btn').addEventListener('click', toggleRecording);

        document.getElementById('prompt-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitPrompt();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' && currentState === STATES.POSE) {
                e.preventDefault();
                setState(STATES.CAPTURE);
            }
        });

        // Navigation arrows (when complete)
        document.getElementById('arrow-prev').addEventListener('click', () => {
            // Go to gallery
            window.location.href = '/index.html';
        });

        document.getElementById('arrow-next').addEventListener('click', () => {
            // Go to the saved composition
            if (currentCompositionId) {
                window.location.href = `/composition.html?id=${currentCompositionId}`;
            } else {
                window.location.href = '/index.html';
            }
        });

        // Control buttons
        document.getElementById('btn-orbit').addEventListener('click', () => {
            scene.enableOrbit(true);
            document.getElementById('btn-orbit').classList.add('selected');
            document.getElementById('btn-snap').classList.remove('selected');
        });

        document.getElementById('btn-snap').addEventListener('click', () => {
            scene.snapToAnamorphicView();
            document.getElementById('btn-snap').classList.add('selected');
            document.getElementById('btn-orbit').classList.remove('selected');
        });

        document.getElementById('btn-share').addEventListener('click', () => {
            showShareQR();
        });

        document.getElementById('btn-close-qr').addEventListener('click', () => {
            hideShareQR();
        });

        // Close QR on click outside
        document.getElementById('qr-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'qr-overlay') {
                hideShareQR();
            }
        });

        // ==========================================
        // QR CODE / SHARE FUNCTIONS
        // ==========================================
        function showShareQR() {
            if (!currentCompositionId) {
                console.warn('No composition to share');
                return;
            }

            const shareUrl = `${window.location.origin}/share/${currentCompositionId}`;
            document.getElementById('share-url').textContent = shareUrl;

            // Generate QR code
            const canvas = document.getElementById('qr-canvas');
            QRCode.toCanvas(canvas, shareUrl, {
                width: 200,
                margin: 2,
                color: {
                    dark: '#ffffff',
                    light: '#000000'
                }
            }, (error) => {
                if (error) console.error('QR code error:', error);
            });

            // Show overlay
            document.getElementById('qr-overlay').classList.add('visible');
        }

        function hideShareQR() {
            document.getElementById('qr-overlay').classList.remove('visible');
        }

        // ==========================================
        // INITIALIZE
        // ==========================================
        initScene();
        initSpeechRecognition();
        document.getElementById('prompt-input').focus();
    </script>
</body>
</html>
